    <style>
      /* Tokens follow the Purple landing: white, violet-tinted ink, lilac
         surfaces, square corners, Inter, and the receding grid behind it all. */
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --ink: #15151c;
        --body: #44424e;
        --muted: #666675;
        --line: #e7e1ec;
        --line-strong: #cfc4d9;
        --tint: #f4f1f6;
        --card: #ffffff;
        --focus: #7b668b;
        --dot: #9933ff;
        --feature: #181820;
        --feature-hover: #35303e;
        --feature-ink: #ffffff;
        --feature-muted: rgb(255 255 255 / 64%);
        --grid: rgb(52 38 72 / 30%);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #050505;
          --ink: #f5f5f5;
          --body: #c9c5d1;
          --muted: #9d99a8;
          --line: #2a2731;
          --line-strong: #4a4356;
          --tint: #17141c;
          --card: #0a0a0c;
          --focus: #b9a6c9;
          --dot: #b266ff;
          --feature: #f5f5f5;
          --feature-hover: #e4dcec;
          --feature-ink: #0d0d12;
          --feature-muted: rgb(13 13 18 / 64%);
          --grid: rgb(255 255 255 / 20%);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
        -webkit-text-size-adjust: 100%;
      }

      body {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: 100svh;
        margin: 0;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        font-feature-settings: "rlig" 1, "calt" 1;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* ── Receding grid, as on the landing hero ── */
      .floor {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
        opacity: 0.5;
        perspective: 400px;
        /* Starts later than the landing's mask so the far edge of the plane
           never draws a hard line above the name. */
        -webkit-mask-image: linear-gradient(
          to bottom,
          transparent 14%,
          #000 42%,
          #000 72%,
          transparent 100%
        );
        mask-image: linear-gradient(
          to bottom,
          transparent 14%,
          #000 42%,
          #000 72%,
          transparent 100%
        );
      }
      .floor-plane {
        position: absolute;
        inset: 0;
        transform: rotateX(35deg);
      }
      .floor-lines {
        position: absolute;
        inset: 0% 0;
        width: 600vw;
        height: 300vh;
        margin-left: -50%;
        transform-origin: 100% 0 0;
        background-image: linear-gradient(to right, var(--grid) 1px, transparent 0),
          linear-gradient(to bottom, var(--grid) 1px, transparent 0);
        background-size: 60px 60px;
      }
      .floor::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, var(--bg), transparent 90%);
      }

      /* ── Page ── */
      main {
        align-self: center;
        width: min(100% - 44px, 620px);
        margin-inline: auto;
        padding-block: 56px 104px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        color: var(--body);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
      .eyebrow::before {
        content: "";
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--dot);
      }

      h1 {
        margin: 32px 0 0;
        font-size: clamp(44px, 12.4vw, 76px);
        font-weight: 650;
        letter-spacing: -0.055em;
        line-height: 1;
        transform-origin: left 70%;
        text-wrap: balance;
      }

      .where {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 26px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.4;
      }
      .where svg {
        flex: none;
        width: 16px;
        height: 16px;
        color: var(--focus);
      }

      .mail {
        margin: 2px 0 0;
      }
      .mail a {
        display: inline-block;
        padding-block: 12px;
        color: var(--ink);
        font-size: 16px;
        line-height: 20px;
        text-decoration: underline;
        text-decoration-color: var(--line-strong);
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
        transition: text-decoration-color 160ms;
      }
      .mail a:hover {
        text-decoration-color: currentColor;
      }

      h2 {
        margin: 34px 0 12px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .links {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .links a {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 84px;
        padding: 0 20px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        font-size: 16px;
        font-weight: 500;
        letter-spacing: -0.015em;
        text-decoration: none;
        transition: background-color 160ms, border-color 160ms;
      }
      .links a:hover {
        border-color: var(--line-strong);
        background: var(--tint);
      }
      .links .icon {
        flex: none;
        width: 20px;
        height: 20px;
      }
      .links .go {
        flex: none;
        width: 18px;
        height: 18px;
        margin-left: auto;
        color: var(--muted);
        transition: transform 160ms, color 160ms;
      }
      .links a:hover .go {
        color: var(--ink);
        transform: translate(2px, -2px);
      }

      .links .feature {
        grid-column: 1 / -1;
      }
      .feature a {
        gap: 18px;
        min-height: 92px;
        padding: 0 26px;
        border-color: var(--feature);
        background: var(--feature);
        color: var(--feature-ink);
      }
      .feature a:hover {
        border-color: var(--feature-hover);
        background: var(--feature-hover);
      }
      .feature .icon {
        width: 22px;
        height: 22px;
      }
      .feature .go,
      .feature a:hover .go {
        color: var(--feature-ink);
      }
      .feature small {
        display: block;
        margin-top: 5px;
        color: var(--feature-muted);
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 0;
      }

      :where(a):focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
      }

      @media (max-width: 560px) {
        main {
          padding-block: 44px 72px;
        }
        .links {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .links a {
          min-height: 64px;
        }
        .feature a {
          min-height: 84px;
          padding: 0 20px;
          gap: 14px;
        }
      }

      /* A single entrance; static content is the default, including reduced motion. */
      @media (prefers-reduced-motion: no-preference) {
        .floor-lines {
          animation: floor 15s linear infinite;
        }
        .eyebrow {
          animation: soft-reveal 500ms ease-out both;
        }
        h1 {
          animation: type-reveal 950ms 120ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
        }
        .where,
        .mail {
          animation: soft-reveal 600ms 620ms ease-out both;
        }
        h2,
        .links {
          animation: soft-reveal 650ms 860ms ease-out both;
        }
      }
      @keyframes floor {
        from {
          transform: translateY(-50%);
        }
        to {
          transform: translateY(0);
        }
      }
      @keyframes type-reveal {
        from {
          opacity: 0;
          filter: blur(12px);
          transform: translateY(10px) scaleX(0.94);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: none;
        }
      }
      @keyframes soft-reveal {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
